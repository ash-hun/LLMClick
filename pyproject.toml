[project]
name = "llmclick"
version = "0.1.0"
description = "Config-driven custom model building: one YAML per model, one pipeline per recipe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # model stack, pinned together: Qwen3.5 needs this transformers and torch pair
  "torch==2.14.0",
  "torchvision==0.29.0",
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "pillow==12.3.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "python-dotenv==1.2.3",
  "datasets==5.0.1",
  "kernels==0.16.1",
  "flash-linear-attention==0.5.2",
  "safetensors==0.8.0",
  "numpy==2.5.3",
  "huggingface-hub==1.31.0",
  # LLMClick core
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "peft>=0.21.2",
]

[project.optional-dependencies]
tracker = ["wandb>=0.19"]
eval = [
    "lm-eval>=0.4.13",
]

[project.scripts]
llmclick = "core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "modeling", "evaluation"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
    "types-tqdm>=4.66",
    "ruff>=0.14",
    "lm-eval>=0.4.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# E501: the code predates the linter and runs wider than 120 in places; UP046: Generic[T] is kept for mypy strict
ignore = ["E501", "UP046"]

[tool.mypy]
files = ["core", "modeling", "evaluation"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["datasets.*", "wandb.*", "lm_eval.*"]
ignore_missing_imports = true

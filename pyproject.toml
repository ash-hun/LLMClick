[project]
name = "llmclick"
version = "0.1.0"
description = "Config-driven training pipeline for Jev-style one-pass decision models (jeff recipe)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # jeff pins (jeff/ is vendored; keep these in step with jeff/README.md)
  "torch==2.14.0",
  "torchvision==0.29.0",
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "pillow==12.3.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "python-dotenv==1.2.3",
  "datasets==5.0.1",
  "matplotlib==3.11.2",
  "kernels==0.16.1",
  "flash-linear-attention==0.5.2",
  "safetensors==0.8.0",
  "numpy==2.5.3",
  "huggingface-hub==1.31.0",
  "imageio-ffmpeg>=0.6",
  # LLMClick core
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mac = ["mlx-lm==0.31.3"]
games = ["vizdoom==1.3.1", "imageio==2.38.0"]
tracker = ["wandb>=0.19"]

[project.scripts]
llmclick = "core.run:main"
jeff-data = "jeff.data:main"
jeff-generate = "jeff.generate:main"
jeff-materials = "jeff.materials:main"
jeff-grounded = "jeff.grounded:main"
jeff-latency = "jeff.latency:main"
jeff-train = "jeff.train:main"
jeff-evaluate = "jeff.evaluate:main"
jeff-serve = "jeff.server:main"
jeff-panel = "jeff.panel:main"
jeff-dashboard = "jeff.dashboard:main"
jeff-mix = "jeff.mix:main"
jeff-extra = "jeff.extra:main"
jeff-voice = "jeff.voice:main"
jeff-jevbench = "jeff.jevbench:main"
jeff-sampled = "jeff.sampled:main"
jeff-probability = "jeff.probability:main"
jeff-prm = "jeff.prm:main"
jeff-codecontests = "jeff.codecontests:main"
jeff-legalbench = "jeff.legalbench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "jeff"]

[dependency-groups]
dev = ["pytest>=8.4", "mypy>=1.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads model weights or uses the GPU heavily"]

[tool.mypy]
files = ["core"]
python_version = "3.12"
strict = true

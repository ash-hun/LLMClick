name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths: ["website/**", "README.md", "evaluation/README.md", "data/README.md", "core/**", "modeling/**", "evaluation/**", "data/**", ".github/workflows/docs.yml"]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: |
          uv sync --frozen
          npm ci --prefix website
      - name: Generate pages from the repository
        run: uv run python website/scripts/sync.py
      - name: Build
        run: npm run build --prefix website
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: website/build

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

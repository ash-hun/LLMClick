a, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">one row a prompt</text><rect x="788" y="250" width="136" height="24" rx="6" fill="#e8f2fd"/><text x="856.0" y="266.5" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#0f2a47" text-anchor="middle">rows.jsonl</text><rect x="24" y="310" width="912" height="34" rx="8" fill="#f3f8fe" stroke="#cfe3f8"/><text x="42" y="332" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3d556e" text-anchor="start">rows.jsonl is what a Modeling config names in data.sources; manifest.json records the counts, the teacher and the cost.</text><text x="42" y="375" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f2a47" text-anchor="start">Teachers</text><rect x="118" y="360" width="86.8" height="22" rx="11" fill="#e8f2fd" stroke="#cfe3f8"/><text x="161.4" y="375" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f2a47" text-anchor="middle">anthropic</text><rect x="212.8" y="360" width="115.60000000000001" height="22" rx="11" fill="#e8f2fd" stroke="#cfe3f8"/><text x="270.6" y="375" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f2a47" text-anchor="middle">openai format</text><rect x="336.40000000000003" y="360" width="65.2" height="22" rx="11" fill="#e8f2fd" stroke="#cfe3f8"/><text x="369.00000000000006" y="375" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f2a47" text-anchor="middle">ollama</text><rect x="409.6" y="360" width="137.2" height="22" rx="11" fill="#e8f2fd" stroke="#cfe3f8"/><text x="478.20000000000005" y="375" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Data: many candidates from a teacher, few rows kept"><rect width="960" height="420" fill="#ffffff"/><rect x="24" y="22" width="912" height="4" rx="2" fill="#1f78d1" opacity="0.35"/><text x="24" y="56" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2a47" text-anchor="start">Data: many candidates from a teacher, few rows kept</text><text x="24" y="78" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b8199" text-anchor="start">Early steps make candidates cheaply; later steps drop most of them for a recorded reason. The cache is the ledger.</text><rect x="24" y="92" width="160" height="196" rx="12" fill="#ffffff" stroke="#cfe3f8" stroke-width="1.5"/><circle cx="50" cy="119" r="12" fill="#1f78d1"/><text x="50" y="123.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="70" y="124" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2a47" text-anchor="start">seeds</text><text x="40" y="146" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f78d1" text-anchor="start">what to make from</text><line x1="40" y1="158" x2="168" y2="158" stroke="#cfe3f8"/><circle cx="43" cy="176" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="52" y="180" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">topics, personas</text><circle cx="43" cy="197" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="52" y="201" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weig
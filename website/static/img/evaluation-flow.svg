<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Evaluation: a checkpoint, items it never trained on, a report"><rect width="960" height="420" fill="#ffffff"/><rect x="24" y="22" width="912" height="4" rx="2" fill="#1f78d1" opacity="0.35"/><text x="24" y="56" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2a47" text-anchor="start">Evaluation: a checkpoint, items it never trained on, a report</text><text x="24" y="78" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b8199" text-anchor="start">Every recipe loads the items, scores the model once per task, and writes one report with the leaks next to the scores.</text><rect x="24" y="92" width="160" height="196" rx="12" fill="#f3f8fe" stroke="#cfe3f8" stroke-width="1.5" stroke-dasharray="6 4" /><text x="40" y="124" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2a47" text-anchor="start">model</text><text x="40" y="146" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f78d1" text-anchor="start">what is measured</text><line x1="40" y1="158" x2="168" y2="158" stroke="#cfe3f8"/><circle cx="43" cy="176" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="52" y="180" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">an experiment&#x27;s run</text><circle cx="43" cy="197" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="52" y="201" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">validate, train, base</text><circle cx="43" cy="218" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="52" y="222" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">or a pinned Hub model</text><line x1="189" y1="190.0" x2="203" y2="190.0" stroke="#1f78d1" stroke-width="2" opacity="0.6"/><path d="M202,185.0 L208,190.0 L202,195.0 Z" fill="#1f78d1" opacity="0.8"/><rect x="212" y="92" width="160" height="196" rx="12" fill="#ffffff" stroke="#cfe3f8" stroke-width="1.5"/><circle cx="238" cy="119" r="12" fill="#1f78d1"/><text x="238" y="123.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="258" y="124" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2a47" text-anchor="start">items</text><text x="228" y="146" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f78d1" text-anchor="start">never trained on</text><line x1="228" y1="158" x2="356" y2="158" stroke="#cfe3f8"/><circle cx="231" cy="176" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="240" y="180" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">your own rows</text><circle cx="231" cy="197" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="240" y="201" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">public benchmarks</text><circle cx="231" cy="218" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="240" y="222" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">audio it never heard</text><rect x="224" y="250" width="136" height="24" rx="6" fill="#e8f2fd"/><text x="292.0" y="266.5" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#0f2a47" text-anchor="middle">rows / clips</text><line x1="377" y1="190.0" x2="391" y2="190.0" stroke="#1f78d1" stroke-width="2" opacity="0.6"/><path d="M390,185.0 L396,190.0 L390,195.0 Z" fill="#1f78d1" opacity="0.8"/><rect x="400" y="92" width="160" height="196" rx="12" fill="#ffffff" stroke="#cfe3f8" stroke-width="1.5"/><circle cx="426" cy="119" r="12" fill="#1f78d1"/><text x="426" y="123.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="446" y="124" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2a47" text-anchor="start">score</text><text x="416" y="146" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f78d1" text-anchor="start">cached per task</text><line x1="416" y1="158" x2="544" y2="158" stroke="#cfe3f8"/><circle cx="419" cy="176" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="428" y="180" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">one stage a task</text><circle cx="419" cy="197" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="428" y="201" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">keyed by the weights</text><circle cx="419" cy="218" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="428" y="222" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">shared by recipes</text><rect x="412" y="250" width="136" height="24" rx="6" fill="#e8f2fd"/><text x="480.0" y="266.5" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#0f2a47" text-anchor="middle">score:&lt;task&gt;</text><line x1="565" y1="190.0" x2="579" y2="190.0" stroke="#1f78d1" stroke-width="2" opacity="0.6"/><path d="M578,185.0 L584,190.0 L578,195.0 Z" fill="#1f78d1" opacity="0.8"/><rect x="588" y="92" width="160" height="196" rx="12" fill="#ffffff" stroke="#cfe3f8" stroke-width="1.5"/><circle cx="614" cy="119" r="12" fill="#1f78d1"/><text x="614" y="123.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="634" y="124" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2a47" text-anchor="start">report</text><text x="604" y="146" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f78d1" text-anchor="start">numbers to trust</text><line x1="604" y1="158" x2="732" y2="158" stroke="#cfe3f8"/><circle cx="607" cy="176" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="616" y="180" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">scores, intervals</text><circle cx="607" cy="197" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="616" y="201" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">contamination</text><circle cx="607" cy="218" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="616" y="222" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">every setting kept</text><rect x="600" y="250" width="136" height="24" rx="6" fill="#e8f2fd"/><text x="668.0" y="266.5" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#0f2a47" text-anchor="middle">report.json</text><line x1="753" y1="190.0" x2="767" y2="190.0" stroke="#1f78d1" stroke-width="2" opacity="0.6"/><path d="M766,185.0 L772,190.0 L766,195.0 Z" fill="#1f78d1" opacity="0.8"/><rect x="776" y="92" width="160" height="196" rx="12" fill="#f3f8fe" stroke="#cfe3f8" stroke-width="1.5" stroke-dasharray="6 4" /><text x="792" y="124" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2a47" text-anchor="start">read it</text><text x="792" y="146" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f78d1" text-anchor="start">where results go</text><line x1="792" y1="158" x2="920" y2="158" stroke="#cfe3f8"/><circle cx="795" cy="176" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="804" y="180" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">evaluation_compare</text><circle cx="795" cy="197" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="804" y="201" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">wandb (tracker)</text><circle cx="795" cy="218" r="2.2" fill="#1f78d1" opacity="0.7"/><text x="804" y="222" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3d556e" text-anchor="start">GET /api/evaluations</text><rect x="24" y="310" width="912" height="34" rx="8" fill="#f3f8fe" stroke="#cfe3f8"/><text x="42" y="332" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3d556e" text-anchor="start">A benchmark added later is the only one that runs; a checkpoint scored once is never scored again for the same task.</text><text x="42" y="375" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f2a47" text-anchor="start">Targets</text><rect x="109" y="360" width="43.6" height="22" rx="11" fill="#e8f2fd" stroke="#cfe3f8"/><text x="130.8" y="375" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f2a47" text-anchor="middle">LLM</text><rect x="160.6" y="360" width="79.6" height="22" rx="11" fill="#e8f2fd" stroke="#cfe3f8"/><text x="200.39999999999998" y="375" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f2a47" text-anchor="middle">Decision</text><rect x="248.2" y="360" width="86.8" height="22" rx="11" fill="#e8f2fd" stroke="#cfe3f8"/><text x="291.59999999999997" y="375" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f2a47" text-anchor="middle">Embedding</text><rect x="343.0" y="360" width="86.8" height="22" rx="11" fill="#e8f2fd" stroke="#cfe3f8"/><text x="386.4" y="375" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f2a47" text-anchor="middle">Wake word</text><rect x="437.8" y="360" width="144.4" height="22" rx="11" fill="#e8f2fd" stroke="#cfe3f8"/><text x="510.0" y="375" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f2a47" text-anchor="middle">TTS (in validate)</text></svg>

    title: Qwen3 report, non-thinking mode, models up to 2B
    source: "Qwen3 Technical Report (arXiv:2505.09388), Table 20"
    url: https://arxiv.org/abs/2505.09388
    models: [Gemma-3-1B-IT, Qwen2.5-1.5B-Instruct, Qwen3-0.6B, Qwen3-1.7B]

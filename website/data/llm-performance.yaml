      MMLU-Redux: [33.3, 50.7, 44.6, 64.4]
      GPQA-D: [19.2, 29.8, 22.9, 28.6]
      IFEval: [54.5, 42.5, 54.5, 68.2]
      Arena-Hard: [17.8, 9.0, 6.5, 36.9]
      MATH-500: [46.4, 55.0, 55.2, 73.0]
      BFCL v3: [16.3, 47.8, 44.1, 52.2]
      LiveCodeBench: [1.8, 5.3, 3.6, 11.6]
      MMMLU: [32.5, 40.4, 37.1, 48.3]


# Benchmark scores of small LLMs, published by their authors or measured here, drawn as polygon charts on the LLM Performance Survey page
# (intros/evaluation/llm-performance.md, `<!-- polygon: <id> -->`). One figure is one table of one source: scores taken
# under different prompts, decoding and harnesses do not compare, so figures are never merged. Scores are 0 to 100,
# one list per axis in the order of `models`. Copy numbers from the source as printed; never fill a gap.
figures:

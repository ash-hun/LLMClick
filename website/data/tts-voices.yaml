# Jarvis voices measured here on one test, drawn as a polygon chart on the Jarvis agent experiment page
# (intros/experiments/speech/jarvis-agent.md, `<!-- polygon: <id> -->`). Scores are raw; `ranges` gives each axis's
# low and high end, the low end at the chart's centre.
figures:
  - id: jarvis-voices
    title: "Jarvis voices on the same 48 lines, two takes each; centre to edge: MOS 1 to 5, heard 0.8 to 1, speaker sim 0.4 to 1"

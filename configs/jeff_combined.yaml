# jeff's combined arm: public data plus synthetic questions from a local OpenAI-compatible teacher (TEACHER_URL).
pipeline:
  name: jeff-2b-combined
  seed: 20260920
  output_dir: ./output

data:
  builders:
    - name: jeff_extra
    - name: jeff_probability
      count: 3000
  folds: {dev: 1500, temperature: 1000}
  synthetic:
    enabled: true
    teacher: {name: openai_compatible}   # url: http://my-server:8888/v1 overrides TEACHER_URL
    slots: 30000
    focus: v5
    concurrency: 8
  mix: {size: 50000, sweep_size: 10000, panel_layout: true, escape: true, adversarial: true}

model:
  backbone: qwen3_5
  name: Qwen/Qwen3.5-2B
  revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
  prompt_layout: state-first

training:
  epochs: 1
  lr: 1.0e-5
  batch_size: 32
  effective_batch_size: 256
  eval_every: 40
  cpu_threads: 16

tracker: {enabled: true, project: llmclick, tags: [jeff, 2b, combined]}

evaluation:
  benchmarks:
    - name: jeff_panel
    - name: jeff_jevbench_hard
  batch_size: 16

# jeff's public-only recipe on Apple silicon (MPS). Same data and hyperparameters as jeff_public_only.yaml;
# micro-batches are smaller for unified memory, the effective batch of 256 is unchanged. Expect many hours.
pipeline:
  recipe: jev
  name: jeff-0.8b-public-mac
  seed: 20260920
  output_dir: ./output
  device: mps

data:
  builders:
    - name: jeff_extra
    - name: jeff_probability
      count: 3000
  folds: {dev: 1500, temperature: 1000, validation: 1000}
  mix: {size: 50000, sweep_size: 10000, panel_layout: true, escape: true, adversarial: true}

model:
  backbone: qwen3_5
  name: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17
  prompt_layout: state-first

training:
  epochs: 1
  lr: 5.0e-6
  batch_size: 8
  effective_batch_size: 256
  token_budget: 4096
  max_length: 8192
  eval_every: 40
  resume_every: 20
  cpu_threads: 8

evaluation:
  benchmarks:
    - name: jeff_panel
    - name: jeff_jevbench_hard
  batch_size: 8

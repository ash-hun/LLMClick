# Your own data, no jeff sources: a Hugging Face classification set through the YAML-only `classification` converter,
# a local Example JSONL, and a local benchmark. Swap dataset ids, fields and criteria; no code needed.
pipeline:
  recipe: jev
  name: custom-0.8b
  seed: 20260920
  output_dir: ./output

data:
  builders:
    - name: huggingface
      dataset: stanfordnlp/snli
      revision: cdb5c3d5eed6ead6e5a341c8e56e669bb666725b   # pin a commit; `main` is not reproducible
      split: train
      limit: 20000
      converter: classification
      suite: snli
      text_fields: [premise, hypothesis]
      label_field: label
      label_map: {"0": entailment, "1": neutral, "2": contradiction}
      instructions: "Using only the premise, classify the hypothesis. Do not assume unstated facts."
      criteria:
        entailment: "The premise shows the hypothesis is true."
        contradiction: "The premise shows the hypothesis is false."
        neutral: "The premise shows neither."
    - name: local_jsonl
      path: data/custom/train.jsonl          # rows already in jeff Example shape
  folds: {dev: 800, temperature: 500, validation: 500}
  mix: {size: 20000, sweep_size: 2000, panel_layout: false, escape: true, adversarial: true}

model:
  backbone: qwen3_5
  name: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17

training: {epochs: 1, lr: 5.0e-6, eval_every: 20}

evaluation:
  benchmarks:
    - name: local_jsonl
      path: data/custom/test.jsonl
    - name: huggingface
      dataset: stanfordnlp/snli
      revision: cdb5c3d5eed6ead6e5a341c8e56e669bb666725b
      split: test
      limit: 1000
      converter: classification
      suite: snli-test
      text_fields: [premise, hypothesis]
      label_field: label
      label_map: {"0": entailment, "1": neutral, "2": contradiction}
      instructions: "Using only the premise, classify the hypothesis. Do not assume unstated facts."
      criteria:
        entailment: "The premise shows the hypothesis is true."
        contradiction: "The premise shows the hypothesis is false."
        neutral: "The premise shows neither."
  batch_size: 16

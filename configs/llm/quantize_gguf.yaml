# A GGUF file for llama.cpp and Ollama, written by llama.cpp's converter (pinned release, environment/llama_cpp/setup.sh)
# and checked by loading it back: held-out loss against the unquantized model. Runs on any device (the converter
# is plain Python), needs the quantize extra. Point `model.name` at a trained checkpoint to export what you trained.
# On Qwen3-0.6B and the sample rows: q8_0 is 805 MB with a loss_delta of 0.006, bf16 1509 MB and 0.0 (MPS).
pipeline:
  recipe: llm_quantize
  name: gguf-qwen3-0.6b
  seed: 20260920
  output_dir: ./output

model:
  architecture: transformer         # hybrid (Qwen3.5) is refused: transformers cannot read its GGUF back to validate
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca

data:
  sources:
    - name: local_jsonl
      path: samples/llm_sft.jsonl   # nothing is calibrated; the held-out fold measures the loss before and after
  validation: 0.2

quantization:
  name: gguf
  type: q8_0                        # or f16, bf16; k-quants (q4_k_m ...) need llama.cpp's compiled tools

training: {max_length: 512}

validation:
  max: {loss_delta: 0.05}

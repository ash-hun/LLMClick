# Multi-teacher on-policy distillation: Qwen3-0.6B answers the prompts itself, and each row's `domain` picks the teacher
# that grades every token it chose: Qwen3-4B the math rows, Qwen3-1.7B the chat rows. A teacher may also be a local
# checkpoint, such as a domain fine-tune this repo wrote (`name: output/<run>/validate/checkpoint`, no revision).
# Every teacher must share the student's vocabulary, and all of them sit in memory beside the student while training
# (in FP32 about 16GB for Qwen3-4B and 7GB for Qwen3-1.7B).
pipeline:
  recipe: llm_multi_teacher_on_policy_distillation
  name: multi-teacher-on-policy-distillation-qwen3-0.6b
  seed: 20260920
  output_dir: ./output

model:
  architecture: transformer
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  template: {enable_thinking: false}   # Qwen3's chat template opens a thinking block unless told not to

data:
  sources:
    - name: local_jsonl
      path: samples/llm_multi_teacher_on_policy_distillation.jsonl  # rows: {"prompt", "domain", "answer"}
  validation: 0.1

method:
  teachers:                         # domain -> teacher; a row whose domain is not here is refused
    math:
      architecture: transformer
      name: Qwen/Qwen3-4B
      revision: 1cfa9a7208912126459214e8b04321603b3df60c
    chat:
      architecture: transformer
      name: Qwen/Qwen3-1.7B
      revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  samples: 2                        # answers sampled per prompt; the reward compares them, so at least 2
  max_new_tokens: 16
  temperature: 1.0
  reward: {name: contains}          # optional outcome reward (any llm_grpo reward); remove for teachers only
  reward_weight: 0.5                # weight of the group-normalized reward against the teachers' token gap

training: {epochs: 1, lr: 1.0e-6, batch_size: 4, accumulation: 1, max_length: 128, max_steps: 4}

validation:
  max: {reverse_kl: 2.0}            # mean token gap between student and its teachers on the greedy answers

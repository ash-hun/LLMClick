# Which Korean words are worth adding to Qwen3's tokenizer: the words of the rows that it splits the most often,
# ranked by the tokens they would save. Nothing is trained. `train/tokens.txt` is what a training recipe's
# `model.tokenizer.tokens_file` reads; `train/checkpoint/` is the extended tokenizer, for inspection.
pipeline:
  recipe: llm_tokenizer
  name: tokenizer-ko-qwen3
  seed: 20260920
  output_dir: ./output

model:
  architecture: transformer
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca

data:
  sources:
    - name: local_jsonl
      path: samples/llm_pretrain_ko.jsonl   # rows: {"text": str}; your Korean or domain corpus
  validation: 0.2

vocabulary:
  count: 300                        # words to add, most tokens saved first
  min_frequency: 3                  # occurrences a word needs in the training rows

validation:
  min: {token_reduction: 0.1}      # share of held-out tokens the added words save

# Merge two fine-tunes of Qwen3-0.6B into one model with TIES: each model's change from the base is trimmed to its
# largest half, a sign is elected per weight, and the changes that agree are averaged. Nothing is trained.
# The models are the checkpoints `configs/llm/sft_transformer.yaml` and `configs/llm/distill.yaml` write; run those first.
pipeline:
  recipe: llm_merge
  name: merge-ties-qwen3-0.6b
  seed: 20260920                    # fixes which entries DARE drops (dare_linear, dare_ties)
  output_dir: ./output

model:                              # the base the changes are taken from; also measured on the held-out rows
  architecture: transformer
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  template: {enable_thinking: false}

merge:
  rule: ties                        # or linear, slerp (two models, `t`), task_arithmetic, dare_linear, dare_ties
  density: 0.5                      # ties and dare: the share of each change that is kept
  models:
    - {path: output/sft-qwen3-0.6b-e15695dc/validate/checkpoint, weight: 1.0}
    - {path: output/distill-qwen3-0.6b-ccc16d73/validate/checkpoint, weight: 1.0}
    # a Hub model: {name: <org/model>, revision: <40-character commit>, weight: 0.5}

data:
  sources:
    - name: local_jsonl
      path: samples/llm_sft.jsonl   # SFT conversations: the held-out share measures the merged model against the base
  validation: 0.1

training: {max_length: 512}         # only the length rule applies: nothing is trained

validation:
  max: {loss_delta: 0.5}            # the merged model's held-out loss minus the base model's

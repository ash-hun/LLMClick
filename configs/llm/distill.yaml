# On-policy distillation: Qwen3-0.6B answers the prompts itself and Qwen3-1.7B grades every token it chose.
# Teacher and student must share one vocabulary; the teacher sits in memory beside the student while training.
pipeline:
  recipe: llm_distill
  name: distill-qwen3-0.6b
  seed: 20260920
  output_dir: ./output

model:
  architecture: transformer
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  template: {enable_thinking: false}   # Qwen3's chat template opens a thinking block unless told not to

data:
  sources:
    - name: local_jsonl
      path: samples/llm_grpo.jsonl  # rows: {"prompt": str | messages}; other keys are ignored
  validation: 0.1

method:
  teacher:
    architecture: transformer
    name: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  samples: 2                        # answers sampled per prompt
  max_new_tokens: 16
  temperature: 1.0

training: {epochs: 1, lr: 1.0e-6, batch_size: 4, accumulation: 1, max_length: 128, max_steps: 4}

validation:
  max: {reverse_kl: 2.0}            # mean token gap between student and teacher on the greedy answers

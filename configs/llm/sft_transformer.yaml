# The same recipe on a plain transformer from the catalog (Qwen3) instead of the hybrid Qwen3.5.
pipeline:
  recipe: llm_sft
  name: sft-qwen3-0.6b
  seed: 20260920
  output_dir: ./output

model:
  architecture: transformer
  name: Qwen/Qwen3-0.6B             # or Qwen/Qwen3-1.7B @ 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  template: {enable_thinking: false}   # Qwen3's chat template opens a thinking block unless told not to

data:
  sources:
    - name: local_jsonl
      path: samples/llm_sft.jsonl
  validation: 0.1

training: {epochs: 1, lr: 1.0e-5, batch_size: 4, accumulation: 2, max_length: 512, max_steps: 4}

validation:
  max: {loss: 5.0}

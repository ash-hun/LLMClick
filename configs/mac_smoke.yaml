# Apple silicon pilot: no downloads except the 0.8B base, code-built data, a handful of updates on MPS.
# Proves data -> mix -> train -> evaluate end to end on a Mac in minutes; not a model worth keeping.
pipeline:
  name: mac-smoke
  seed: 20260920
  output_dir: ./output
  device: mps

data:
  builders:
    - name: jeff_probability
      count: 400
  folds: {dev: 40, temperature: 24}
  mix: {size: 1000, sweep_size: 50, panel_layout: false, escape: true, adversarial: true}

model:
  backbone: qwen3_5
  name: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17

training:
  epochs: 1
  lr: 5.0e-6
  batch_size: 4
  effective_batch_size: 16
  token_budget: 2048
  max_length: 2048
  eval_every: 2
  resume_every: 2
  stop_after: 4
  cpu_threads: 8

evaluation:
  benchmarks:
    - name: jeff_probability
      count: 60
  batch_size: 8

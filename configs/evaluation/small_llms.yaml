# Instruction-tuned LLMs of up to 2B parameters, the catalog's and their peers, on one harness under one set of
# settings: the measured charts of the LLM Performance Survey (website/intros/evaluation/llm-performance.md). Every
# (model, benchmark) is one cached stage, so an interrupted run resumes and a model added later is the only one scored.
# Needs `uv sync --extra eval`, HF_TOKEN with Gemma's terms accepted. Hours on a Mac; minutes per model on a GPU.
pipeline:
  recipe: evaluation_compare
  name: small-llms
  seed: 20261018
  output_dir: ./output

runs:   # Hub models at pinned commits; the first is the base the differences are reported against
  - {label: qwen3-0.6b, name: Qwen/Qwen3-0.6B, revision: c1899de289a04d12100db370d81485cdf75e47ca}
  - {label: qwen3.5-0.8b, name: Qwen/Qwen3.5-0.8B, revision: 2fc06364715b967f1860aea9cf38778875588b17}
  - {label: gemma-3-1b, name: google/gemma-3-1b-it, revision: dcc83ea841ab6100d6b47a070329e1ba4cf78752}
  - {label: qwen2.5-1.5b, name: Qwen/Qwen2.5-1.5B-Instruct, revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306}
  - {label: smollm2-1.7b, name: HuggingFaceTB/SmolLM2-1.7B-Instruct, revision: 31b70e2e869a7173562077fd711b654946d38674}
  - {label: qwen3-1.7b, name: Qwen/Qwen3-1.7B, revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e}
  - {label: qwen3.5-2b, name: Qwen/Qwen3.5-2B, revision: 15852e8c16360a2fea060d615a32b45270f8a8fc}

benchmarks:
  # Multiple choice is scored by likelihood without the chat template (wrapped, Qwen3-0.6B's arc_challenge fell from
  # 0.30 to 0.10 on 20 items); the generated answers (gsm8k, ifeval) go through it. Limits per task (per subject for
  # mmlu and kmmlu) keep a Mac run to hours; the report carries every interval.
  tasks:
    - {name: mmlu, num_fewshot: 5, limit: 10, chat_template: false}          # 57 subjects: 570 items
    - {name: arc_challenge, num_fewshot: 25, limit: 200, chat_template: false}
    - {name: hellaswag, num_fewshot: 10, limit: 200, chat_template: false}
    - {name: winogrande, num_fewshot: 5, limit: 200, chat_template: false}
    - {name: truthfulqa_mc2, limit: 200, chat_template: false}
    - {name: gsm8k, num_fewshot: 8, limit: 100}
    - {name: ifeval, limit: 100}
    - {name: kmmlu, num_fewshot: 5, limit: 10, chat_template: false}         # 45 subjects: 450 items

axes:
  knowledge: [mmlu]
  science: [arc_challenge]
  commonsense: [hellaswag, winogrande]
  truthfulness: [truthfulqa_mc2]
  math: [gsm8k]
  instructions: [ifeval]
  korean: [kmmlu]

decoding: {temperature: 0, max_new_tokens: 768}
chat_template: true                 # every run is instruction-tuned; the tasks above opt out
thinking: false                     # Qwen3 and Qwen3.5 answer without reasoning, as the others do
evaluation: {batch_size: 1}         # MPS: few-shot prompts times a 150k to 260k vocabulary exceed one Metal kernel above 1

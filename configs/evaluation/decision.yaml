# A decision model on the JevBench public tiers (easy 48, standard 72, hard 111 items), without and with reasoning.
# The tiers are downloaded once from the JevBench repository (fstandhartinger/jevbench, MIT) at a pinned revision;
# `path` points at a local copy instead. `data.sources` can also be local_jsonl rows in the Jev format.
pipeline:
  recipe: evaluation_decision
  name: decision-pointer-on-jevbench
  output_dir: ./output

model:
  experiment: output/decision-pointer-qwen3.5-0.8b-e442dea1
  checkpoint: validate              # validate | train | base | a checkpoint directory

data:
  sources:
    - {name: jevbench}                # revision: <commit>, path: <dir>, tiers: [easy, standard, hard], limit: N per tier

think: both                         # off: decide at once; on: reason first; both: two rows in the report
max_think: 256                      # reasoning tokens per question; null: the experiment's method.max_think
evaluation: {batch_size: 8}         # latency per question is measured at this batch size
